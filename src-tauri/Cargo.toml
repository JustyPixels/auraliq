[package]
name = "auraliq"
version = "0.4.0"
edition = "2021"
license = "MIT"
description = "Retro-inspired unified music hub"

[lib]
name = "auraliq_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.35", features = ["bundled"] }
symphonia = { version = "0.5.5", features = ["all"] }
cpal = "0.15.3"
lofty = "0.25.5"
walkdir = "2.5.1"
sha2 = "0.10"
souvlaki = { version = "0.9.3", default-features = false }
realfft = "3.5.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking", "charset", "http2", "system-proxy"] }
keyring = { version = "3.6", features = ["windows-native"] }
async-trait = "0.1"
url = "2"

[dev-dependencies]
tempfile = "3"
