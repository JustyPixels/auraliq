[package]
name = "auraliq"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Retro-inspired unified music hub"

[lib]
name = "auraliq_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
